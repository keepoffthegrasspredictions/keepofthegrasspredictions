<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --page-bg: #efefef;
      --panel-bg: rgba(255,255,255,0.32);
      --text: #1a1a1a;
      --muted: #646464;
      --green: #1aa96d;
      --green-dark: #0f5f3d;
      --line: rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 26px 50px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 1.25fr;
      gap: 32px;
      align-items: start;
      min-height: 380px;
    }

    .fixtures-box {
      padding-top: 10px;
    }

    .filter-row {
      display: flex;
      gap: 18px;
      margin: 0 0 18px 2px;
      align-items: center;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: rgba(27, 27, 27, 0.72);
      font-size: 14px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
      opacity: 0.85;
    }

    .filter-btn.active {
      background: var(--green);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      opacity: 1;
      box-shadow: 0 6px 14px rgba(26, 169, 109, 0.18);
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .match-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: 4px 0;
    }

    .teams {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: #111;
    }

    .meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pick-btn {
      border: 1px solid rgba(0,0,0,0.18);
      background: transparent;
      color: #222;
      border-radius: 3px;
      min-width: 48px;
      height: 28px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pick-btn:hover {
      background: rgba(26, 169, 109, 0.06);
      border-color: rgba(0,0,0,0.28);
    }

    .brand-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 320px;
      padding-top: 10px;
      text-align: center;
    }

    .brand-title {
      font-size: clamp(3rem, 4vw, 5.2rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 800;
      color: #29c57c;
      margin: 0;
      text-align: center;
      text-shadow: 0 2px 0 rgba(122, 197, 160, 0.08);
    }

    .subtitle {
      margin-top: 18px;
      font-size: 16px;
      color: var(--muted);
      font-style: italic;
    }

    .picks-box {
      margin-top: 26px;
    }

    .picks-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3.2rem);
      line-height: 1;
      letter-spacing: -0.06em;
      color: #171717;
      font-weight: 800;
    }

    .live-tag {
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      opacity: 0.8;
    }

    #dashboard {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
      font-style: italic;
      padding-top: 8px;
    }

    .picked-match {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(26, 169, 109, 0.2);
      border-radius: 8px;
      background: rgba(26, 169, 109, 0.08);
      color: var(--text);
      font-size: 15px;
      font-style: normal;
      font-weight: 700;
    }

    .picked-match span {
      margin-left: 8px;
      color: var(--muted);
      font-weight: 500;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .brand-panel {
        min-height: 220px;
      }
    }

    @media (max-width: 560px) {
      .page { padding: 18px; }
      .match-item { grid-template-columns: 1fr; }
      .pick-btn { justify-self: start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="hero">
      <section class="fixtures-box">
        <div class="filter-row">
          <button class="filter-btn active">Today</button>
          <button class="filter-btn">This Week</button>
          <button class="filter-btn">Live</button>
        </div>

        <div class="match-list">
          <div class="match-item">
            <div>
              <span class="teams">Barcelona vs Real Madrid</span>
              <span class="meta">La Liga • 18:00</span>
            </div>
            <button class="pick-btn" type="button">Pick</button>
          </div>

          <div class="match-item">
            <div>
              <span class="teams">Liverpool vs Chelsea</span>
              <span class="meta">Premier League • 20:00</span>
            </div>
            <button class="pick-btn" type="button">Pick</button>
          </div>

          <div class="match-item">
            <div>
              <span class="teams">PSG vs Marseille</span>
              <span class="meta">Ligue 1 • 22:00</span>
            </div>
            <button class="pick-btn" type="button">Pick</button>
          </div>
        </div>
      </section>

      <section class="brand-panel">
        <h1 class="brand-title">Keep Off The Grass<br>Predictions</h1>
        <div class="subtitle">Daily soccer match tips and picks</div>
      </section>
    </main>

    <section class="picks-box">
      <div class="picks-head">
        <h2>Your Picks</h2>
        <div class="live-tag">Live tracker</div>
      </div>
      <div id="dashboard">No picks yet — choose your matches above.</div>
    </section>
  </div>

  <script>
    const sampleMatches = [
      { id: 1, home: "Barcelona", away: "Real Madrid", time: "18:00", league: "La Liga" },
      { id: 2, home: "Liverpool", away: "Chelsea", time: "20:00", league: "Premier League" },
      { id: 3, home: "PSG", away: "Marseille", time: "22:00", league: "Ligue 1" }
    ];

    const dashboard = document.getElementById("dashboard");
    const picks = [];

    document.querySelectorAll(".pick-btn").forEach((button, index) => {
      button.addEventListener("click", () => {
        const match = sampleMatches[index];
        if (!match || picks.some(item => item.id === match.id)) return;
        picks.push(match);
        renderDashboard();
      });
    });

    function renderDashboard() {
      if (!picks.length) {
        dashboard.textContent = "No picks yet — choose your matches above.";
        return;
      }

      dashboard.innerHTML = "";
      picks.forEach(match => {
        const el = document.createElement("div");
        el.className = "picked-match";
        el.innerHTML = `${match.home} vs ${match.away}<span>(${match.time})</span>`;
        dashboard.appendChild(el);
      });
    }
  </script>
</body>
</html>
