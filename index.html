<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --page-bg: #efefef;
      --panel-bg: rgba(255,255,255,0.4);
      --text: #1f1f1f;
      --muted: #6c6c6c;
      --green-dark: #0f5f3d;
      --green-mid: #1ea86f;
      --green-light: #8bedb6;
      --green-pale: #dffce9;
      --line: rgba(0,0,0,0.12);
      --soft-shadow: rgba(15, 95, 61, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      max-width: 1380px;
      margin: 0 auto;
      padding: 10px 26px 50px;
    }

    .header {
      display: flex;
      justify-content: center;
      margin: 0 auto 10px;
      padding-top: 8px;
    }

    .crest {
      position: relative;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #48d88e 0%, #1ea86f 28%, #0b5f3d 78%, #073d29 100%);
      border: 4px solid rgba(9, 70, 47, 0.9);
      box-shadow: 0 8px 18px rgba(12, 50, 35, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .crest::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: rgba(0,0,0,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .soccer-ball {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5f5f5 0%, #dde7eb 100%);
      box-shadow: 0 0 0 4px rgba(9, 70, 47, 0.8);
      z-index: 1;
    }

    .soccer-ball::before,
    .soccer-ball::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        linear-gradient(90deg, transparent 0 14%, #1d3e3b 14% 18%, transparent 18% 32%, #1d3e3b 32% 36%, transparent 36% 50%, #1d3e3b 50% 54%, transparent 54% 68%, #1d3e3b 68% 72%, transparent 72% 100%),
        linear-gradient(0deg, transparent 0 16%, #1d3e3b 16% 20%, transparent 20% 34%, #1d3e3b 34% 38%, transparent 38% 52%, #1d3e3b 52% 56%, transparent 56% 70%, #1d3e3b 70% 74%, transparent 74% 100%);
      opacity: 0.95;
      transform: rotate(20deg);
    }

    .soccer-ball::after {
      background: radial-gradient(circle at center, rgba(9,70,47,0.2) 0 10%, transparent 10% 100%);
      transform: rotate(-24deg);
    }

    .soccer-ball .inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 30px;
      align-items: start;
      padding-top: 10px;
    }

    .fixtures-box {
      padding: 10px 0 0 0;
    }

    .filter-row {
      display: flex;
      gap: 18px;
      margin: 0 0 16px 0;
      padding-left: 2px;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: rgba(27,27,27,0.7);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      padding: 0;
      cursor: pointer;
      opacity: 0.8;
    }

    .filter-btn.active {
      background: #1aa96d;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      opacity: 1;
      box-shadow: 0 6px 14px rgba(26, 169, 109, 0.18);
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 10px;
    }

    .match-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
      min-height: 46px;
    }

    .match-item .teams {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: #111;
      display: block;
    }

    .match-item .meta {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .pick-btn {
      border: 1px solid rgba(0,0,0,0.18);
      background: transparent;
      color: #222;
      border-radius: 3px;
      min-width: 44px;
      height: 28px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      padding: 0 10px;
      transition: all 0.15s ease;
    }

    .pick-btn:hover {
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.25);
    }

    .brand-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 330px;
      padding-top: 10px;
      position: relative;
    }

    .brand-panel .small-ball {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f8f8f8 0%, #dfeaf0 52%, #b7dfe9 100%);
      box-shadow: 0 0 0 2px rgba(30, 168, 111, 0.9);
      top: 90px;
      right: 220px;
      opacity: 0.8;
    }

    .brand-panel .small-ball::before,
    .brand-panel .small-ball::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        linear-gradient(90deg, transparent 0 14%, #1c3f3b 14% 18%, transparent 18% 32%, #1c3f3b 32% 36%, transparent 36% 50%, #1c3f3b 50% 54%, transparent 54% 68%, #1c3f3b 68% 72%, transparent 72% 100%),
        linear-gradient(0deg, transparent 0 16%, #1c3f3b 16% 20%, transparent 20% 34%, #1c3f3b 34% 38%, transparent 38% 52%, #1c3f3b 52% 56%, transparent 56% 70%, #1c3f3b 70% 74%, transparent 74% 100%);
      transform: rotate(26deg);
      opacity: 0.9;
    }

    .brand-panel .small-ball.second {
      top: 145px;
      right: 190px;
      transform: scale(0.8);
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      text-align: center;
    }

    .brand-title .brand-soccer {
      font-size: 26px;
      color: var(--green-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 4vw, 5.2rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 800;
      color: #2dc77a;
      text-align: center;
      text-shadow: 0 3px 0 rgba(141, 229, 174, 0.08);
    }

    .subtitle {
      margin-top: 18px;
      font-size: 16px;
      color: var(--muted);
      font-style: italic;
      text-align: center;
    }

    .picks-box {
      margin-top: 28px;
      padding-top: 8px;
    }

    .picks-hed {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 20px;
    }

    h2 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3.2rem);
      line-height: 1;
      letter-spacing: -0.06em;
      color: #171717;
      font-weight: 800;
    }

    .live-tag {
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      opacity: 0.85;
      white-space: nowrap;
    }

    .dashboard {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
      font-style: italic;
      padding-top: 6px;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .brand-panel {
        min-height: 240px;
      }

      .brand-panel .small-ball {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .match-item {
        grid-template-columns: 1fr;
      }

      .pick-btn {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="crest" aria-label="Keep Off The Grass logo">
        <div class="soccer-ball"><div class="inner"></div></div>
      </div>
    </div>

    <div class="hero">
      <div class="fixtures-box">
        <div class="filter-row">
          <button class="filter-btn active">Today</button>
          <button class="filter-btn">This Week</button>
          <button class="filter-btn">Live</button>
        </div>

        <div class="match-list">
          <div class="match-item">
            <div>
              <span class="teams">Barcelona vs Real Madrid</span>
              <span class="meta">La Liga • 18:00</span>
            </div>
            <button class="pick-btn">Pick</button>
          </div>

          <div class="match-item">
            <div>
              <span class="teams">Liverpool vs Chelsea</span>
              <span class="meta">Premier League • 20:00</span>
            </div>
            <button class="pick-btn">Pick</button>
          </div>

          <div class="match-item">
            <div>
              <span class="teams">PSG vs Marseille</span>
              <span class="meta">Ligue 1 • 22:00</span>
            </div>
            <button class="pick-btn">Pick</button>
          </div>
        </div>
      </div>

      <div class="brand-panel">
        <div class="small-ball"></div>
        <div class="small-ball second"></div>

        <div class="brand-title">
          <span class="brand-soccer">⚽</span>
          <h1>Keep Off The Grass<br>Predictions</h1>
        </div>
        <div class="subtitle">Daily soccer match tips and picks</div>
      </div>
    </div>

    <div class="picks-box">
      <div class="picks-hed">
        <h2>Your Picks</h2>
        <div class="live-tag">Live tracker</div>
      </div>
      <div class="dashboard">No picks yet — choose your matches above.</div>
    </div>
  </div>
</body>
</html>
