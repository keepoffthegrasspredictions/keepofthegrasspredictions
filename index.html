<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --bg: #091610;
      --bg-soft: #0f221b;
      --panel: #11281f;
      --panel-alt: #173227;
      --panel-light: #f3faf5;
      --line: rgba(144, 197, 164, 0.2);
      --text: #edf8f0;
      --muted: #b8d1c0;
      --green: #25c76d;
      --green-strong: #1bab5e;
      --green-soft: rgba(37, 199, 109, 0.12);
      --green-bright: #7bf0ab;
      --shadow: rgba(3, 11, 8, 0.4);
      --danger: #ff7676;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(37, 199, 109, 0.12), transparent 30%),
        linear-gradient(180deg, #08140f 0%, #0a1d17 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .topbar {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .crest {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      position: relative;
      background: linear-gradient(135deg, #0d3b29, #1d9a58 45%, #2dd56c);
      border: 4px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 40px rgba(24, 146, 75, 0.3);
      overflow: hidden;
    }

    .crest::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 60%);
    }

    .crest::after {
      content: "⚽";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      color: #fff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 24px;
      align-items: stretch;
    }

    .card {
      background: rgba(18, 39, 31, 0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 40px var(--shadow);
      overflow: hidden;
    }

    .fixtures-card {
      padding: 18px 18px 12px;
      background: linear-gradient(180deg, rgba(16, 32, 26, 0.94) 0%, rgba(11, 24, 19, 0.98) 100%);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filter-btn {
      border: 1px solid rgba(170, 211, 183, 0.25);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--green), var(--green-strong));
      border-color: transparent;
      color: #032b18;
    }

    .matches {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(170, 211, 183, 0.18);
      border-radius: 12px;
    }

    .match-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .match-meta {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .pick-btn {
      border: 1px solid rgba(123, 240, 171, 0.4);
      background: rgba(37, 199, 109, 0.08);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .pick-btn:hover {
      background: rgba(37, 199, 109, 0.2);
      border-color: rgba(123, 240, 171, 0.7);
    }

    .brand-card {
      background: linear-gradient(180deg, rgba(17, 40, 31, 0.9), rgba(9, 22, 16, 0.98));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
      min-height: 300px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      text-align: center;
    }

    .brand-icon {
      font-size: 30px;
      filter: drop-shadow(0 6px 14px rgba(37, 199, 109, 0.4));
      color: var(--green-bright);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 3vw, 3.4rem);
      line-height: 1.04;
      letter-spacing: -0.05em;
      color: #dffef0;
      text-shadow: 0 6px 30px rgba(37, 199, 109, 0.15);
      font-weight: 900;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.05rem;
      text-align: center;
    }

    .picks-card {
      margin-top: 22px;
      padding: 20px 18px 16px;
      background: linear-gradient(180deg, rgba(18, 39, 31, 0.9) 0%, rgba(11, 23, 18, 0.98) 100%);
    }

    .picks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.3rem);
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .badge {
      background: var(--green-soft);
      color: var(--green-bright);
      border: 1px solid rgba(123, 240, 171, 0.35);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #dashboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 60px;
    }

    .picked-match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(180deg, rgba(29, 146, 88, 0.16), rgba(15, 58, 36, 0.32));
      border: 1px solid rgba(123, 240, 171, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-weight: 700;
    }

    .picked-match span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty {
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(170, 211, 183, 0.25);
      color: var(--muted);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .crest {
        width: 96px;
        height: 96px;
      }

      .match-row {
        grid-template-columns: 1fr;
      }

      .pick-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="crest" aria-label="Keep Off The Grass logo"></div>
    </div>

    <div class="hero">
      <section class="card fixtures-card">
        <div class="filter-row">
          <button class="filter-btn active">Today</button>
          <button class="filter-btn">This Week</button>
          <button class="filter-btn">Live</button>
        </div>
        <div id="matches" class="matches"></div>
      </section>

      <section class="card brand-card">
        <div class="brand-row">
          <span class="brand-icon">⚽</span>
          <h1>Keep Off The Grass Predictions</h1>
        </div>
        <div class="subtitle">Daily soccer match tips and picks</div>
      </section>
    </div>

    <section class="card picks-card">
      <div class="picks-header">
        <h2>Your Picks</h2>
        <div class="badge">Live tracker</div>
      </div>
      <div id="dashboard"></div>
    </section>
  </div>

  <script>
    const sampleMatches = [
      { id: 1, home: "Barcelona", away: "Real Madrid", time: "18:00", league: "La Liga" },
      { id: 2, home: "Liverpool", away: "Chelsea", time: "20:00", league: "Premier League" },
      { id: 3, home: "PSG", away: "Marseille", time: "22:00", league: "Ligue 1" }
    ];

    const matchesDiv = document.getElementById("matches");
    const dashboardDiv = document.getElementById("dashboard");
    let picks = [];

    function renderMatches() {
      matchesDiv.innerHTML = "";
      sampleMatches.forEach(match => {
        const row = document.createElement("div");
        row.className = "match-row";

        const main = document.createElement("div");
        main.innerHTML = `
          <div class="match-title">${match.home} vs ${match.away}</div>
          <div class="match-meta">${match.league} • ${match.time}</div>
        `;

        const btn = document.createElement("button");
        btn.textContent = "Pick";
        btn.className = "pick-btn";
        btn.onclick = () => pickMatch(match.id);

        row.appendChild(main);
        row.appendChild(btn);
        matchesDiv.appendChild(row);
      });
    }

    function pickMatch(id) {
      const match = sampleMatches.find(m => m.id === id);
      if (!match) return;
      if (!picks.some(p => p.id === match.id)) {
        picks.push(match);
        renderDashboard();
      }
    }

    function renderDashboard() {
      dashboardDiv.innerHTML = "";
      if (!picks.length) {
        dashboardDiv.innerHTML = '<div class="empty">No picks yet — choose your matches above.</div>';
        return;
      }

      picks.forEach(match => {
        const card = document.createElement("div");
        card.className = "picked-match";
        card.innerHTML = `
          <div>${match.home} vs ${match.away}</div>
          <span>${match.time}</span>
        `;
        dashboardDiv.appendChild(card);
      });
    }

    renderMatches();
    renderDashboard();
  </script>
</body>
</html>
