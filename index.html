<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --page-bg: #efefef;
      --text: #1f1f1f;
      --muted: #6c6c6c;
      --green-dark: #0f5f3d;
      --green: #1ea86f;
      --line: rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      max-width: 1380px;
      margin: 0 auto;
      padding: 22px 26px 50px;
    }

    .header {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .site-logo {
      display: block;
      width: 145px;
      height: 145px;
      object-fit: contain;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 30px;
      align-items: start;
    }

    .fixtures-box { padding-top: 10px; }

    .filter-row {
      display: flex;
      gap: 18px;
      margin: 0 0 18px 2px;
    }

    .filter-btn {
      border: 0;
      background: transparent;
      color: rgba(27, 27, 27, 0.75);
      font-size: 14px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--green);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .match-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 48px;
    }

    .teams {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    .meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pick-btn {
      border: 1px solid rgba(0, 0, 0, 0.18);
      background: transparent;
      color: #222;
      border-radius: 3px;
      min-width: 52px;
      height: 30px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .pick-btn:hover {
      background: rgba(30, 168, 111, 0.08);
      border-color: var(--green);
    }

    .brand-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 330px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #2dc77a;
      font-size: clamp(3rem, 4vw, 5.2rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 18px;
      color: var(--muted);
      font-size: 16px;
      font-style: italic;
    }

    .picks-box { margin-top: 28px; }

    .picks-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      color: #171717;
      font-size: clamp(2rem, 3vw, 3.2rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .live-tag {
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
    }

    #dashboard {
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 18px;
      font-style: italic;
    }

    .picked-match {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(30, 168, 111, 0.25);
      border-radius: 8px;
      background: rgba(30, 168, 111, 0.08);
      color: var(--text);
      font-size: 15px;
      font-style: normal;
      font-weight: 700;
    }

    .picked-match span {
      margin-left: 8px;
      color: var(--muted);
      font-weight: 500;
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .brand-panel { min-height: 220px; }
    }

    @media (max-width: 560px) {
      .page { padding: 18px; }
      .site-logo { width: 120px; height: 120px; }
      .match-item { grid-template-columns: 1fr; }
      .pick-btn { justify-self: start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="site-logo" src="./logo.png" alt="Keep Off The Grass Predictions logo">
    </header>

    <main class="hero">
      <section class="fixtures-box">
        <div class="filter-row">
          <button class="filter-btn active">Today</button>
          <button class="filter-btn">This Week</button>
          <button class="filter-btn">Live</button>
        </div>
        <div id="matches" class="match-list"></div>
      </section>

      <section class="brand-panel">
        <h1>Keep Off The Grass<br>Predictions</h1>
        <div class="subtitle">Daily soccer match tips and picks</div>
      </section>
    </main>

    <section class="picks-box">
      <div class="picks-head">
        <h2>Your Picks</h2>
        <div class="live-tag">Live tracker</div>
      </div>
      <div id="dashboard"></div>
    </section>
  </div>

  <script>
    const sampleMatches = [
      { id: 1, home: "Barcelona", away: "Real Madrid", time: "18:00", league: "La Liga" },
      { id: 2, home: "Liverpool", away: "Chelsea", time: "20:00", league: "Premier League" },
      { id: 3, home: "PSG", away: "Marseille", time: "22:00", league: "Ligue 1" }
    ];

    const matchesDiv = document.getElementById("matches");
    const dashboardDiv = document.getElementById("dashboard");
    const picks = [];

    function renderMatches() {
      matchesDiv.innerHTML = "";
      sampleMatches.forEach(match => {
        const item = document.createElement("div");
        item.className = "match-item";
        item.innerHTML = `
          <div>
            <span class="teams">${match.home} vs ${match.away}</span>
            <span class="meta">${match.league} • ${match.time}</span>
          </div>
          <button class="pick-btn" type="button">Pick</button>
        `;
        item.querySelector("button").addEventListener("click", () => pickMatch(match.id));
        matchesDiv.appendChild(item);
      });
    }

    function pickMatch(id) {
      const match = sampleMatches.find(item => item.id === id);
      if (!match || picks.some(item => item.id === id)) return;
      picks.push(match);
      renderDashboard();
    }

    function renderDashboard() {
      dashboardDiv.innerHTML = "";
      if (!picks.length) {
        dashboardDiv.textContent = "No picks yet — choose your matches above.";
        return;
      }

      picks.forEach(match => {
        const item = document.createElement("div");
        item.className = "picked-match";
        item.innerHTML = `${match.home} vs ${match.away}<span>${match.time}</span>`;
        dashboardDiv.appendChild(item);
      });
    }

    renderMatches();
    renderDashboard();
  </script>
</body>
</html>
