<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --page-bg: #071f16;
      --page-bg-light: #123f2f;
      --panel: rgba(8, 31, 22, 0.62);
      --panel-card: rgba(255, 255, 255, 0.055);
      --text: #f3fbf5;
      --muted: #b5d1be;
      --green: #20bd70;
      --green-bright: #55e894;
      --border: rgba(153, 230, 178, 0.2);
      --shadow: rgba(0, 0, 0, 0.25);
      --live-red: #ff4b4b;
      --panel-right: rgba(18, 64, 47, 0.8);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -15%, rgba(32, 189, 112, 0.2), transparent 38%),
        linear-gradient(135deg, var(--page-bg) 0%, var(--page-bg-light) 100%);
    }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.10)),
        radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 46%),
        linear-gradient(90deg, rgba(255,255,255,0.015) 0, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 200px);
      opacity: 0.9;
    }

    body::after {
      content: "KEEP OFF THE GRASS";
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      font-size: clamp(2.4rem, 5vw, 9vw);
      font-weight: 800;
      letter-spacing: 0.09em;
      color: rgba(255, 255, 255, 0.04);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 12px 0 48px;
    }

    .header {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo-frame {
      width: 210px;
      height: 210px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(126, 239, 165, 0.58);
      border-radius: 50%;
      background: linear-gradient(145deg, #0a5939, #159d5e 56%, #55e894);
      box-shadow:
        0 0 0 7px rgba(32, 189, 112, 0.15),
        0 0 28px rgba(85, 232, 148, 0.38),
        0 18px 38px var(--shadow);
    }

    .site-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 18px;
      align-items: stretch;
    }

    .fixtures-box,
    .brand-panel,
    .picks-box {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 16px 34px var(--shadow);
      backdrop-filter: blur(5px);
    }

    .fixtures-box { padding: 16px; }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 7px 11px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.active {
      color: #042416;
      background: var(--green-bright);
      box-shadow: 0 5px 14px rgba(32, 189, 112, 0.2);
    }

    .match-list { display: flex; flex-direction: column; gap: 7px; }

    .match-item {
      display: block;
      padding: 11px 12px;
      border: 1px solid rgba(153, 230, 178, 0.14);
      border-radius: 11px;
      background: var(--panel-card);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .match-item:hover {
      transform: translateY(-1px);
      border-color: rgba(153, 230, 178, 0.34);
      background: rgba(255, 255, 255, 0.08);
    }

    .teams {
      display: block;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }

    .meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .brand-panel {
      position: relative;
      min-height: 294px;
      padding: 20px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(145deg, rgba(12, 44, 32, 0.78), var(--panel-right));
      overflow: hidden;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.0)),
        radial-gradient(circle at 50% 30%, rgba(85, 232, 148, 0.12), transparent 44%);
      pointer-events: none;
    }

    .brand-panel > * { position: relative; z-index: 1; }

    .brand-title {
      max-width: 560px;
      margin: 0;
      color: var(--green-bright);
      font-size: clamp(2.6rem, 4vw, 4.3rem);
      line-height: 0.94;
      letter-spacing: -0.055em;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(32, 189, 112, 0.14);
      text-wrap: balance;
    }

    .subtitle {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      font-style: italic;
    }

    .picks-box {
      margin-top: 16px;
      padding: 16px 18px;
    }

    .picks-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 9px;
    }

    h2 {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.7rem, 3vw, 2.6rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(255, 75, 75, 0.85);
      border-radius: 999px;
      background: rgba(122, 16, 16, 0.7);
      color: #ffb0b0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
    }

    .live-tag::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18), 0 0 9px rgba(255, 75, 75, 0.95);
      animation: live-pulse 1s infinite alternate;
    }

    @keyframes live-pulse {
      from { background: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18), 0 0 9px rgba(255, 75, 75, 0.95); }
      to { background: var(--live-red); box-shadow: 0 0 0 3px rgba(255, 75, 75, 0.22), 0 0 11px rgba(255, 75, 75, 1); }
    }

    #dashboard {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 15px;
      font-style: italic;
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; }
      .brand-panel { min-height: 230px; }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 24px, 1180px); padding-top: 18px; }
      .logo-frame { width: 190px; height: 190px; }
      .picks-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="logo-frame">
        <img class="site-logo" src="./logo.png" alt="Keep Off The Grass Predictions logo">
      </div>
    </header>

    <main class="hero">
      <section class="fixtures-box">
        <div class="filter-row">
          <button class="filter-btn active" type="button">Today</button>
          <button class="filter-btn" type="button">This Week</button>
          <button class="filter-btn" type="button">Live</button>
        </div>

        <div class="match-list">
          <div class="match-item"><span class="teams">Barcelona vs Real Madrid</span><span class="meta">La Liga • 18:00</span></div>
          <div class="match-item"><span class="teams">Liverpool vs Chelsea</span><span class="meta">Premier League • 20:00</span></div>
          <div class="match-item"><span class="teams">PSG vs Marseille</span><span class="meta">Ligue 1 • 22:00</span></div>
        </div>
      </section>

      <section class="brand-panel">
        <h1 class="brand-title">Keep Off The Grass<br>Predictions</h1>
        <div class="subtitle">Daily football predictions</div>
      </section>
    </main>

    <section class="picks-box">
      <div class="picks-head"><h2>Predictions for Today</h2><div class="live-tag">Live tracker</div></div>
      <div id="dashboard">No predictions yet</div>
    </section>
  </div>
</body>
</html>
