<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --panel: #ffffff;
      --panel-alt: #f8f8f8;
      --line: #dfe3e8;
      --text: #1f2933;
      --muted: #52606d;
      --green: #1a9d5a;
      --green-dark: #0f7e46;
      --green-soft: #ebfaf1;
      --shadow: rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 24px 60px;
    }

    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-badge {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f4b2d, #1d8f52 55%, #2ebf65);
      border: 4px solid #0f2018;
      box-shadow: 0 10px 30px rgba(29, 143, 82, 0.22);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-badge::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 60%);
    }

    .logo-badge::after {
      content: "⚽";
      font-size: 42px;
      color: #fff;
      position: relative;
      z-index: 1;
      text-shadow: 0 3px 12px rgba(0,0,0,0.25);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap: 40px;
      align-items: center;
      min-height: 340px;
      margin-top: 18px;
    }

    .fixture-box {
      padding: 8px 0;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 18px;
      line-height: 1.4;
      color: var(--text);
      padding: 6px 0;
    }

    .match-name {
      flex: 1;
      font-weight: 400;
      min-width: 0;
    }

    .match-time {
      color: var(--muted);
      font-size: 15px;
      margin-left: 5px;
      white-space: nowrap;
    }

    .pick-btn {
      border: 1px solid #bfc8d0;
      background: #f3f5f6;
      color: #1f2933;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .pick-btn:hover {
      background: #e9edf0;
      border-color: #aab5bf;
    }

    .title-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    .title-icon {
      font-size: 24px;
      color: var(--green);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--green);
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 1.05rem;
      font-style: normal;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 18px var(--shadow);
      padding: 18px 20px;
    }

    .picks-section {
      margin-top: 18px;
    }

    .picks-title {
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      font-weight: 700;
      margin: 0 0 14px;
      color: var(--text);
    }

    #dashboard {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .picked-match {
      background: var(--green-soft);
      border: 1px solid #bde7c9;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .picked-match span {
      color: var(--muted);
      font-weight: 500;
      margin-left: 8px;
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .topbar {
        margin-bottom: 8px;
      }

      .logo-badge {
        width: 92px;
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="logo-badge" aria-label="Keep Off The Grass logo"></div>
    </div>

    <div class="hero">
      <div class="fixture-box">
        <div id="matches" class="match-list"></div>
      </div>

      <div>
        <div class="title-wrap">
          <span class="title-icon">⚽</span>
          <h1>Keep Off The Grass Predictions</h1>
        </div>
        <div class="subtitle">Daily soccer match tips and picks</div>
      </div>
    </div>

    <div class="picks-section">
      <h2 class="picks-title">Your Picks</h2>
      <div id="dashboard" class="panel"></div>
    </div>
  </div>

  <script>
    const sampleMatches = [
      { id: 1, home: "Barcelona", away: "Real Madrid", time: "18:00" },
      { id: 2, home: "Liverpool", away: "Chelsea", time: "20:00" },
      { id: 3, home: "PSG", away: "Marseille", time: "22:00" }
    ];

    const matchesDiv = document.getElementById("matches");
    const dashboardDiv = document.getElementById("dashboard");
    let picks = [];

    function renderMatches() {
      matchesDiv.innerHTML = "";
      sampleMatches.forEach(match => {
        const row = document.createElement("div");
        row.className = "match-row";

        const label = document.createElement("div");
        label.className = "match-name";
        label.innerHTML = `${match.home} vs ${match.away} <span class="match-time">(${match.time})</span>`;

        const btn = document.createElement("button");
        btn.className = "pick-btn";
        btn.textContent = "Pick";
        btn.onclick = () => pickMatch(match.id);

        row.appendChild(label);
        row.appendChild(btn);
        matchesDiv.appendChild(row);
      });
    }

    function pickMatch(id) {
      const match = sampleMatches.find(m => m.id === id);
      if (!match) return;
      if (!picks.some(p => p.id === match.id)) {
        picks.push(match);
        renderDashboard();
      }
    }

    function renderDashboard() {
      dashboardDiv.innerHTML = "";
      if (!picks.length) {
        dashboardDiv.innerHTML = '<div class="picked-match">No picks yet</div>';
        return;
      }

      picks.forEach(match => {
        const div = document.createElement("div");
        div.className = "picked-match";
        div.innerHTML = `${match.home} vs ${match.away} <span>(${match.time})</span>`;
        dashboardDiv.appendChild(div);
      });
    }

    renderMatches();
    renderDashboard();
  </script>
</body>
</html>
