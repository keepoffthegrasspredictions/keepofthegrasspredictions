<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --page-bg: #ebf4ee;
      --text: #14251d;
      --muted: #dfeee2;
      --green: #1aa96d;
      --green-dark: #0f5f3d;
      --green-pale: #e3f8eb;
      --line: rgba(255,255,255,0.18);
      --shadow: rgba(6, 28, 21, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(56, 211, 124, 0.14), transparent 35%),
        linear-gradient(135deg, #0c2d22 0%, #123c2d 42%, #1a4d38 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #f2f9f3;
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 26px 50px;
    }

    .header {
      display: flex;
      justify-content: center;
      margin-bottom: 26px;
    }

    .logo-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      padding: 18px;
      border: 5px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      background: linear-gradient(145deg, #0b5939, #1aa96d 55%, #61e69a);
      box-shadow: 0 0 0 8px rgba(26, 169, 109, 0.18), 0 16px 32px var(--shadow);
    }

    .site-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      background: rgba(255,255,255,0.94);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 1.25fr;
      gap: 32px;
      align-items: start;
      min-height: 380px;
    }

    .fixtures-box,
    .brand-panel,
    .picks-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(9, 25, 20, 0.42);
      box-shadow: 0 12px 28px var(--shadow);
      backdrop-filter: blur(2px);
    }

    .fixtures-box { padding: 18px 20px 20px; }

    .filter-row {
      display: flex;
      gap: 18px;
      margin: 0 0 18px 2px;
      align-items: center;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: rgba(242, 249, 243, 0.8);
      font-size: 14px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--green);
      color: #fff;
      border-radius: 999px;
      padding: 7px 13px;
      box-shadow: 0 6px 14px rgba(26, 169, 109, 0.22);
    }

    .match-list { display: flex; flex-direction: column; gap: 12px; }

    .match-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
    }

    .teams {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: #f2f9f3;
    }

    .meta {
      display: block;
      margin-top: 4px;
      color: rgba(223, 238, 226, 0.88);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pick-btn {
      border: 1px solid rgba(255,255,255,0.26);
      background: rgba(255,255,255,0.06);
      color: #f2f9f3;
      border-radius: 6px;
      min-width: 52px;
      height: 30px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pick-btn:hover { background: var(--green); color: #fff; border-color: var(--green); }

    .brand-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 320px;
      padding: 30px;
      text-align: center;
      background: linear-gradient(145deg, rgba(8, 28, 22, 0.7), rgba(20, 56, 42, 0.56));
      border-color: rgba(123, 240, 171, 0.2);
    }

    .brand-title {
      font-size: clamp(3rem, 4vw, 5.2rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 800;
      color: #2fe283;
      margin: 0;
      text-align: center;
    }

    .subtitle { margin-top: 18px; font-size: 16px; color: rgba(223, 238, 226, 0.86); font-style: italic; }

    .picks-box { margin-top: 26px; padding: 20px 22px; }

    .picks-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 8px; }

    h2 { margin: 0; font-size: clamp(2rem, 3vw, 3.2rem); line-height: 1; letter-spacing: -0.06em; color: #f2f9f3; font-weight: 800; }

    .live-tag { color: #7ef0b3; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: lowercase; }

    #dashboard { min-height: 52px; display: flex; align-items: center; justify-content: center; color: rgba(223, 238, 226, 0.86); font-size: 18px; font-style: italic; padding-top: 8px; }

    .picked-match { width: 100%; padding: 12px 14px; border: 1px solid rgba(26, 169, 109, 0.28); border-radius: 8px; background: rgba(26, 169, 109, 0.12); color: #f2f9f3; font-size: 15px; font-style: normal; font-weight: 700; }

    .picked-match span { margin-left: 8px; color: rgba(223, 238, 226, 0.8); font-weight: 500; }

    @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } .brand-panel { min-height: 220px; } }
    @media (max-width: 560px) { .page { padding: 18px; } .logo-frame { width: 180px; height: 180px; } .match-item { grid-template-columns: 1fr; } .pick-btn { justify-self: start; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="logo-frame"><img class="site-logo" src="./logo.png" alt="Keep Off The Grass Predictions logo"></div>
    </header>

    <main class="hero">
      <section class="fixtures-box">
        <div class="filter-row"><button class="filter-btn active">Today</button><button class="filter-btn">This Week</button><button class="filter-btn">Live</button></div>
        <div class="match-list">
          <div class="match-item"><div><span class="teams">Barcelona vs Real Madrid</span><span class="meta">La Liga • 18:00</span></div><button class="pick-btn" type="button">Pick</button></div>
          <div class="match-item"><div><span class="teams">Liverpool vs Chelsea</span><span class="meta">Premier League • 20:00</span></div><button class="pick-btn" type="button">Pick</button></div>
          <div class="match-item"><div><span class="teams">PSG vs Marseille</span><span class="meta">Ligue 1 • 22:00</span></div><button class="pick-btn" type="button">Pick</button></div>
        </div>
      </section>

      <section class="brand-panel"><h1 class="brand-title">Keep Off The Grass<br>Predictions</h1><div class="subtitle">Daily football match tips</div></section>
    </main>

    <section class="picks-box"><div class="picks-head"><h2>Your Picks</h2><div class="live-tag">Live tracker</div></div><div id="dashboard">No picks yet — choose your matches above.</div></section>
  </div>

  <script>
    const sampleMatches = [
      { id: 1, home: "Barcelona", away: "Real Madrid", time: "18:00" },
      { id: 2, home: "Liverpool", away: "Chelsea", time: "20:00" },
      { id: 3, home: "PSG", away: "Marseille", time: "22:00" }
    ];
    const dashboard = document.getElementById("dashboard");
    const picks = [];
    document.querySelectorAll(".pick-btn").forEach((button, index) => {
      button.addEventListener("click", () => {
        const match = sampleMatches[index];
        if (!match || picks.some(item => item.id === match.id)) return;
        picks.push(match);
        renderDashboard();
      });
    });
    function renderDashboard() {
      if (!picks.length) { dashboard.textContent = "No picks yet — choose your matches above."; return; }
      dashboard.innerHTML = "";
      picks.forEach(match => {
        const el = document.createElement("div");
        el.className = "picked-match";
        el.innerHTML = `${match.home} vs ${match.away}<span>(${match.time})</span>`;
        dashboard.appendChild(el);
      });
    }
  </script>
</body>
</html>
