<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Off The Grass Predictions</title>
  <style>
    :root {
      --bg: #f4f5f6;
      --panel: #ffffff;
      --panel-strong: #0c1f1a;
      --panel-soft: #f0f7f3;
      --line: #dfe6e0;
      --text: #14252a;
      --muted: #5d6d73;
      --green: #1fa760;
      --green-dark: #0f7e46;
      --green-soft: #eafaf0;
      --green-strong: #0d4026;
      --accent: #17bf73;
      --shadow: rgba(13, 31, 23, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(31, 167, 96, 0.08), transparent 34%),
        var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 34px 22px 60px;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .crest {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0b3d28, #1a8d51 50%, #2bbd69);
      border: 4px solid #1a2019;
      position: relative;
      box-shadow: 0 14px 30px rgba(18, 122, 70, 0.2);
      overflow: hidden;
    }

    .crest::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 60%);
    }

    .crest::after {
      content: "⚽";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #fff;
      text-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 26px;
      align-items: start;
      margin-top: 8px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(17, 32, 19, 0.06);
      overflow: hidden;
    }

    .fixtures-panel {
      padding: 18px 18px 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f9fbfa 100%);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--green-strong);
      border-color: var(--green-strong);
      color: #fff;
    }

    .matches {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .match-main {
      min-width: 0;
    }

    .match-teams {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 3px;
      color: var(--text);
    }

    .match-meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .pick-btn {
      border: 1px solid #c8d7ce;
      background: #f7faf7;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: 0.14s ease;
    }

    .pick-btn:hover {
      background: #edf7f0;
      border-color: #b4d7bf;
    }

    .brand-block {
      padding: 28px 18px 20px;
      background: linear-gradient(180deg, #f9fcfa 0%, #edf6f1 100%);
      min-height: 308px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      text-align: center;
    }

    .brand-badge {
      font-size: 28px;
      color: var(--green-dark);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 3.1vw, 3.3rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      color: var(--green-dark);
      font-weight: 800;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.04rem;
      text-align: center;
    }

    .picks-panel {
      margin-top: 20px;
      padding: 20px 20px 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f5faf6 100%);
    }

    .picks-header {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.4rem);
      color: var(--text);
      letter-spacing: -0.04em;
    }

    .pill {
      background: var(--green-soft);
      color: var(--green-dark);
      border: 1px solid #bce7c7;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    #dashboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 60px;
    }

    .picked-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--green-soft);
      border: 1px solid #b8ddc0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
    }

    .picked-card span {
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
    }

    .empty {
      background: #f6f8f7;
      border: 1px dashed var(--line);
      color: var(--muted);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .brand-block {
        min-height: auto;
        padding-top: 8px;
      }

      .match-card {
        grid-template-columns: 1fr;
      }

      .pick-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="crest" aria-label="Keep Off The Grass logo"></div>
    </div>

    <div class="hero">
      <section class="panel fixtures-panel">
        <div class="filters">
          <button class="filter-btn active">Today</button>
          <button class="filter-btn">This Week</button>
          <button class="filter-btn">Live</button>
        </div>
        <div id="matches" class="matches"></div>
      </section>

      <section class="panel brand-block">
        <div class="brand-title">
          <span class="brand-badge">⚽</span>
          <h1>Keep Off The Grass Predictions</h1>
        </div>
        <div class="subtitle">Daily soccer match tips and picks</div>
      </section>
    </div>

    <section class="panel picks-panel">
      <div class="picks-header">
        <h2>Your Picks</h2>
        <div class="pill">Live tracker</div>
      </div>
      <div id="dashboard"></div>
    </section>
  </div>

  <script>
    const sampleMatches = [
      { id: 1, home: "Barcelona", away: "Real Madrid", time: "18:00", league: "La Liga" },
      { id: 2, home: "Liverpool", away: "Chelsea", time: "20:00", league: "Premier League" },
      { id: 3, home: "PSG", away: "Marseille", time: "22:00", league: "Ligue 1" }
    ];

    const matchesDiv = document.getElementById("matches");
    const dashboardDiv = document.getElementById("dashboard");
    let picks = [];

    function renderMatches() {
      matchesDiv.innerHTML = "";

      sampleMatches.forEach(match => {
        const card = document.createElement("div");
        card.className = "match-card";

        const main = document.createElement("div");
        main.className = "match-main";
        main.innerHTML = `
          <div class="match-teams">${match.home} vs ${match.away}</div>
          <div class="match-meta">${match.league} • ${match.time}</div>
        `;

        const btn = document.createElement("button");
        btn.className = "pick-btn";
        btn.textContent = "Pick";
        btn.onclick = () => pickMatch(match.id);

        card.appendChild(main);
        card.appendChild(btn);
        matchesDiv.appendChild(card);
      });
    }

    function pickMatch(id) {
      const match = sampleMatches.find(m => m.id === id);
      if (!match) return;
      if (!picks.some(p => p.id === match.id)) {
        picks.push(match);
        renderDashboard();
      }
    }

    function renderDashboard() {
      dashboardDiv.innerHTML = "";

      if (!picks.length) {
        dashboardDiv.innerHTML = '<div class="empty">No picks yet — choose your matches above.</div>';
        return;
      }

      picks.forEach(match => {
        const div = document.createElement("div");
        div.className = "picked-card";
        div.innerHTML = `
          <div>${match.home} vs ${match.away}</div>
          <span>(${match.time})</span>
        `;
        dashboardDiv.appendChild(div);
      });
    }

    renderMatches();
    renderDashboard();
  </script>
</body>
</html>
